name: repopilot

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      GITHUB_CREDENTIALS_KEY: ${GITHUB_CREDENTIALS_KEY:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repopilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repopilot}
      REDIS_URL: redis://redis:6379/0
      EXECUTION_IMAGE: ${EXECUTION_IMAGE:-repopilot-dev:local}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  runtime:
    image: ${EXECUTION_IMAGE:-repopilot-dev:local}
    build:
      context: .
      dockerfile: deploy/runtime.Dockerfile
    command: ["python3", "--version"]
    network_mode: none
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    command: ["python", "-m", "repopilot.worker"]
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      GITHUB_CREDENTIALS_KEY: ${GITHUB_CREDENTIALS_KEY:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repopilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repopilot}
      REDIS_URL: redis://redis:6379/0
      EXECUTION_IMAGE: ${EXECUTION_IMAGE:-repopilot-dev:local}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      runtime:
        condition: service_completed_successfully
    deploy:
      replicas: 1
    stop_grace_period: 60s
    restart: "no"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
