[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "Isolated Python repository coding harness with independently verified patches"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]",
  "pydantic>=2.12.2,<3",
  "pydantic-settings>=2,<3",
  "httpx",
  "packaging>=24,<27",
  "sqlalchemy[asyncio]>=2,<3",
  "cryptography==50.0.1",
  "asyncpg>=0.29,<1",
  "redis>=7,<8",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[project.optional-dependencies]
# bcrypt is an indirect test need: cryptography requires it to serialize
# OpenSSH passphrase-protected keys (tests/test_github_settings.py).
dev = ["pytest>=9.0.3,<10", "pytest-asyncio", "ruff", "bcrypt>=4,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
