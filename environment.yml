# Host development environment, usable on macOS and Windows.
# Create: conda env create --file environment.yml
# Activate: conda activate repopilot
# The editable install resolves runtime and dev dependencies from pyproject.toml.
# Runtime images install the separately generated uv.lock instead.
name: repopilot
channels:
  - defaults
dependencies:
  - python=3.12.14
  - pip=26.2.1
  - pip:
      - --editable .[dev]
